# Builds a release when a version tag is pushed.
#
# Two routes in, and they arrive very differently:
#
#   From a terminal     git tag -a v2.0.8 --cleanup=verbatim -F notes.md
#                       git push origin v2.0.8
#                       No release exists yet, so one is created as a draft.
#
#   From the GitHub UI  Publishing a release creates the tag as a side effect.
#                       By the time this runs the release already exists, is
#                       already public, and already carries the notes just
#                       written in the editor -- so it is left alone and only
#                       given its files.
#
# --cleanup=verbatim matters on the first route: git strips lines beginning
# with '#' from a tag message by default, which silently eats every markdown
# heading in the notes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Windows, not by preference: PyInstaller cannot cross-compile, so the two
    # .exe files can only be produced on the platform they run on.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The annotated tag object itself, not just the commit -- the release
          # notes are read out of its message below.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Before anything is built. The tag is what the updater compares against
      # __APP_VERSION__, which is baked in from package.json at build time -- so
      # if the two disagree the released binary misreports its own version and
      # every board either offers an update forever or never notices one.
      - name: Check the tag matches package.json
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag: $TAG    package.json: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json ($PKG). Bump package.json, commit, then retag."
            exit 1
          fi

      # An empty client id builds cleanly and produces a board where sign-in
      # simply does not work -- no error at build time, and nothing visibly
      # wrong until somebody tries to use it.
      - name: Check the signing-in client id is present
        shell: bash
        run: |
          if [ -z "${{ secrets.VITE_CLIENT_ID }}" ]; then
            echo "::error::Repository secret VITE_CLIENT_ID is not set. The build would ship a board that cannot sign in."
            exit 1
          fi
          echo "VITE_CLIENT_ID is set."

      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # vite build, then both PyInstaller passes, then the zips. A fresh runner
      # is also what makes this trustworthy: PyInstaller reuses whatever it
      # collected into its workpath last time, which on a developer machine has
      # shipped a board nobody built, under a convincingly fresh timestamp.
      # There is nothing to reuse here.
      - name: Build the release
        env:
          # Vite inlines VITE_* at build time, and reads them straight from the
          # process environment -- no .env file is needed on the runner, which
          # is just as well since .env is gitignored and never reaches CI.
          #
          # It is held as a repository secret for tidiness and rotation, not
          # for confidentiality: this is a public OAuth client id for a PKCE
          # flow, and it is already readable in the JavaScript of every release
          # that has ever shipped.
          VITE_CLIENT_ID: ${{ secrets.VITE_CLIENT_ID }}
        run: npm run build:release

      - name: Show what was produced
        shell: bash
        run: ls -la release/

      # Kept even if the release step fails, so a build is never thrown away
      # for a reason as small as a bad token or a name collision.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: release/
          retention-days: 14

      # Attach to whatever release already exists for this tag, and create one
      # only when there is none.
      #
      # Creating unconditionally produced two releases on a single tag: the one
      # published from the UI, public and empty, and this workflow's draft
      # holding every file. An existing release therefore keeps its title, body
      # and draft state untouched -- this step's whole job then is the assets.
      - name: Attach the build to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Drafts are invisible to /releases/tags/{tag}, so the list endpoint
          # is the only way to find one by tag name. jq reads the tag out of the
          # environment rather than having the shell interpolate it, which keeps
          # the quoting survivable.
          find_release() {
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq '[.[] | select(.tag_name==env.TAG)] | first | .id // empty'
          }

          REL_ID="$(find_release)"

          if [ -z "$REL_ID" ]; then
            # A lightweight tag carries no message of its own, and %(contents)
            # quietly falls back to the tagged commit's message -- which reads
            # like release notes without being any. Only trust an annotated tag.
            if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
              git tag -l --format='%(contents)' "$TAG" > tagmsg.txt
              TITLE="$(head -1 tagmsg.txt)"
              tail -n +2 tagmsg.txt > notes.md
              gh release create "$TAG" --draft --title "$TITLE" --notes-file notes.md
            else
              echo "::notice::$TAG is a lightweight tag and carries no notes of its own. Generating them."
              gh release create "$TAG" --draft --title "$TAG" --generate-notes
            fi
            REL_ID="$(find_release)"
            echo "created draft release $REL_ID"
          else
            echo "release $REL_ID already exists for $TAG - attaching assets, leaving its notes alone"
          fi

          UPLOAD="$(gh api "repos/$GITHUB_REPOSITORY/releases/$REL_ID" --jq .upload_url | sed 's/{.*//')"

          for f in release/*; do
            NAME="$(basename "$f")"
            # A re-run has to replace rather than collide.
            OLD="$(NAME="$NAME" gh api "repos/$GITHUB_REPOSITORY/releases/$REL_ID/assets" \
              --jq '[.[] | select(.name==env.NAME)] | first | .id // empty')"
            if [ -n "$OLD" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD" >/dev/null
            fi
            curl -sS -X POST "$UPLOAD?name=$NAME" \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" -o /dev/null -w "  uploaded %{http_code}  $NAME"
            echo
          done

          URL="$(gh api "repos/$GITHUB_REPOSITORY/releases/$REL_ID" --jq .html_url)"
          DRAFT="$(gh api "repos/$GITHUB_REPOSITORY/releases/$REL_ID" --jq .draft)"
          echo "### Assets attached (draft=$DRAFT)" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
